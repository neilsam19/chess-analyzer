<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Chess Analyzer v0</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Chess Analyzer v0</h1>

      <div class="card">
        <input id="pgnFile" type="file" accept=".pgn" />
        <button id="analyzeBtn">Analyze</button>
        <p id="status"></p>
      </div>

      <div class="grid">
        <div class="card">
          <h2>Game</h2>
          <pre id="gameInfo">Upload a PGN to start.</pre>
        </div>

        <div class="card">
          <h2>Turning Points</h2>
          <pre id="turningPoints"></pre>
        </div>
      </div>

      <div class="card">
        <h2>Raw Response (debug)</h2>
        <pre id="raw"></pre>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
