<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Chess Analyzer v0</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Chess Analyzer v0</h1>

      <div class="card">
        <input id="pgnFile" type="file" accept=".pgn" />
        <button id="analyzeBtn">Analyze</button>
        <p id="status"></p>
      </div>

      <div id="boardSection" style="display: none;">
        <div class="grid">
          <div class="card">
            <h2>Board</h2>
            <div id="board" style="width: 400px"></div>
          </div>

          <div class="card">
            <h2>Game Info</h2>
            <pre id="gameInfo"></pre>
            <h3>Turning Points</h3>
            <pre id="turningPoints"></pre>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>Raw Response (debug)</h2>
        <pre id="raw">Upload a PGN to start.</pre>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
